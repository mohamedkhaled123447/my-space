<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout concept: an engineer's logbook. One sticky header with tabs, a single column of ruled panels,
   and a two-pane phase browser on the Roadmap tab. Cool blue-slate neutrals, one ink-blue accent,
   and three status hues (amber learning, violet practicing, green done). */
:root {
  --bg: #f3f5f9;
  --surface: #ffffff;
  --surface2: #e9edf4;
  --line: #d3dae6;
  --fg: #141b28;
  --muted: #566277;
  --accent: #2748c8;
  --accent-ink: #ffffff;
  --learn: #a85f00;
  --practice: #6a3fc2;
  --done: #146c45;
  --warn: #b3261e;
  --added: #0b6f86;
  --font-display: 'Bricolage Grotesque', 'IBM Plex Sans', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131c; --surface: #151c28; --surface2: #1d2634; --line: #2a3548; --fg: #e6ebf4; --muted: #98a4b9;
    --accent: #86a2ff; --accent-ink: #0a1022; --learn: #e2a345; --practice: #b9a0ff; --done: #4cc38a; --warn: #ff8f86; --added: #55c2d8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131c; --surface: #151c28; --surface2: #1d2634; --line: #2a3548; --fg: #e6ebf4; --muted: #98a4b9;
  --accent: #86a2ff; --accent-ink: #0a1022; --learn: #e2a345; --practice: #b9a0ff; --done: #4cc38a; --warn: #ff8f86; --added: #55c2d8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 0 48px; }
.wrap { max-width: 1080px; margin-inline: auto; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); margin-inline: -16px; padding-inline: 16px; }
.top-in { max-width: 1080px; margin-inline: auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 16px; padding-block: 10px 0; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-family: var(--font-display); font-size: 20px; line-height: 1.1; margin: 0; letter-spacing: -0.01em; font-weight: 700; }
.brand span { color: var(--muted); font-size: 12.5px; }
#savechip { font-family: var(--font-mono); font-size: 11.5px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); background: var(--surface); }
#savechip[data-k="ok"] { color: var(--done); border-color: var(--done); }
#savechip[data-k="warn"] { color: var(--learn); border-color: var(--learn); }
nav.tabs { max-width: 1080px; margin-inline: auto; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px 8px; cursor: pointer; color: var(--muted); font-weight: 500; white-space: nowrap; }
.tab:hover { color: var(--fg); }
.tab.on { color: var(--fg); border-bottom-color: var(--accent); }

main { max-width: 1080px; margin-inline: auto; padding-block: 20px 0; }
.view { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px; min-width: 0; }
.panel h3 { font-family: var(--font-display); font-size: 17px; margin: 0 0 6px; letter-spacing: -0.005em; }
.panel h3.gap { margin-top: 20px; }
.sub { color: var(--muted); margin: 0 0 12px; }
.meta { color: var(--muted); font-family: var(--font-mono); font-size: 12px; margin: 4px 0 0; }
.count { font-family: var(--font-mono); font-size: 12px; color: var(--accent-ink); background: var(--accent); border-radius: 10px; padding: 1px 8px; vertical-align: 2px; }
.ok { color: var(--done); }
.late { color: var(--warn); }

.hero-top { display: flex; flex-wrap: wrap; gap: 12px 32px; justify-content: space-between; align-items: flex-end; margin-bottom: 14px; }
.big { font-family: var(--font-display); font-size: 56px; line-height: 1; margin: 0; letter-spacing: -0.03em; }
.hero-side p { margin: 0; text-align: right; }

@media (max-width: 520px) { .hero-side p { text-align: left; } .big { font-size: 46px; } }

.bar { height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.bar.lg { height: 10px; border-radius: 5px; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 5px; padding: 7px 14px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { background: var(--warn); color: var(--bg); border-color: var(--warn); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.link { border: 0; background: none; color: var(--accent); padding: 8px 0 0; }
.in { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 5px; padding: 7px 10px; }

.msg { color: var(--warn); margin: 0 0 10px; font-weight: 500; }
.msg.ok { color: var(--done); margin: 10px 0 0; min-height: 1em; }

.tag { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; border: 1px solid var(--line); border-radius: 3px; padding: 1px 6px; margin-left: 8px; color: var(--muted); white-space: nowrap; vertical-align: 2px; }
.tag.new { color: var(--added); border-color: var(--added); }
.tag.due { color: var(--warn); border-color: var(--warn); }

/* topics */
.trow { border-top: 1px solid var(--line); }
.trow:first-of-type { border-top: 0; }
.trow-head { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px 12px; align-items: center; padding: 8px 0; }
.tname { display: flex; gap: 8px; align-items: flex-start; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; min-width: 0; }
.caret { color: var(--muted); width: 12px; flex: none; padding-top: 2px; }
.tt { display: flex; flex-direction: column; min-width: 0; }
.tn { font-weight: 600; overflow-wrap: anywhere; }
.td { color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
.tp { color: var(--muted); font-family: var(--font-mono); font-size: 11.5px; margin-top: 2px; }
.th { font-family: var(--font-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.stat { border: 1px solid var(--line); background: var(--bg); border-radius: 5px; padding: 5px 8px; font-size: 13px; font-weight: 500; cursor: pointer; }
.stat[data-s="1"] { color: var(--learn); border-color: var(--learn); }
.stat[data-s="2"] { color: var(--practice); border-color: var(--practice); }
.stat[data-s="3"] { color: var(--done); border-color: var(--done); background: color-mix(in srgb, var(--done) 10%, var(--bg)); }
.trow[data-s="3"] .tn { text-decoration: line-through; text-decoration-color: var(--muted); text-decoration-thickness: 1px; }
@media (max-width: 560px) { .trow-head { grid-template-columns: minmax(0, 1fr) auto; } .th { display: none; } }
.tdetail { display: flex; flex-direction: column; gap: 6px; padding: 4px 0 16px 20px; }
.lab { font-size: 12.5px; font-weight: 600; margin-top: 6px; display: flex; gap: 8px; align-items: baseline; }
.hint { font-weight: 400; color: var(--muted); font-size: 12px; }
.ext { font-size: 13px; color: var(--accent); }
.tactions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.gap { margin-top: 20px; }

/* roadmap */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.toolbar .in { max-width: 280px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 4px 12px; cursor: pointer; font-size: 13px; color: var(--muted); }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.rm { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 20px; align-items: start; }
.phases { display: flex; flex-direction: column; gap: 6px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 96px); max-height: calc(100vh - 120px); overflow-y: auto; padding-right: 2px; }
.phbtn { display: flex; flex-direction: column; gap: 4px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; cursor: pointer; }
.phbtn.on { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.phl { display: flex; justify-content: space-between; gap: 8px; }
.phn { font-family: var(--font-mono); font-size: 12px; font-weight: 500; }
.phc { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.pht { font-size: 13px; color: var(--muted); }
.rmmain { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px; min-width: 0; }
.ph-head { display: flex; flex-direction: column; gap: 6px; padding-bottom: 12px; }
.ph-title { font-family: var(--font-display); font-size: 26px; line-height: 1.15; margin: 0; letter-spacing: -0.015em; text-wrap: balance; }
.eyebrow { font-family: var(--font-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; }
.goal { margin: 0; max-width: 68ch; }
.cat { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid var(--line); margin-top: 20px; padding-bottom: 4px; }
.cat h3 { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin: 0; color: var(--muted); font-weight: 500; }

@media (max-width: 820px) {
  .rm { grid-template-columns: minmax(0, 1fr); }
  .phases { position: static; max-height: none; flex-direction: row; overflow-x: auto; padding-bottom: 6px; }
  .phbtn { min-width: 150px; flex: none; }
}

/* reviews, log */
.review { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; border-top: 1px solid var(--line); padding: 10px 0; }
.rv-main { min-width: 0; flex: 1 1 260px; }
.rv-name { font-weight: 600; margin: 0; }
.rv-btns { display: flex; gap: 8px; align-items: center; }
.logform { display: grid; grid-template-columns: 90px 120px 100px minmax(0, 1fr) auto; gap: 8px; margin-top: 14px; }
.logform .in[hidden] { display: none; }
@media (max-width: 720px) { .logform { grid-template-columns: 1fr 1fr; } .logform .grow { grid-column: 1 / -1; } .logform .btn { grid-column: 1 / -1; } }
.entry { display: grid; grid-template-columns: 70px 70px minmax(0, 1fr) 70px 28px; gap: 8px; align-items: baseline; border-top: 1px solid var(--line); padding: 7px 0; font-size: 14px; }
.ed, .ek, .em { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.en { overflow-wrap: anywhere; }
.em { text-align: right; }
.x { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; }
.x:hover { color: var(--warn); }
@media (max-width: 560px) { .entry { grid-template-columns: 60px minmax(0, 1fr) 56px 24px; } .ek { display: none; } }
.wk { position: relative; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; height: 190px; align-items: end; padding-top: 18px; margin-top: 8px; }
.wk-col { display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; height: 100%; gap: 4px; }
.wk-bar { background: var(--surface2); border-radius: 3px 3px 0 0; min-height: 2px; border-top: 2px solid var(--muted); }
.wk-bar.cur { background: color-mix(in srgb, var(--accent) 30%, var(--surface2)); border-top-color: var(--accent); }
.wk-val { font-family: var(--font-mono); font-size: 11.5px; text-align: center; min-height: 14px; }
.wk-lab { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; }
.wk-target { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--muted); pointer-events: none; margin-bottom: 36px; }
.wk-target span { position: absolute; right: 0; top: -17px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); background: var(--surface); padding-left: 4px; }

/* timeline */
.settings { display: flex; flex-wrap: wrap; gap: 12px 24px; margin-bottom: 12px; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12.5px; font-weight: 600; }
.field .in { width: 160px; }
.field .in.num { width: 90px; }
.field.check { flex-direction: row; align-items: center; gap: 8px; padding-bottom: 6px; }
.field.check label { font-weight: 400; font-size: 14px; }
.chartwrap { margin: 8px 0 12px; }
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-family: var(--font-mono); font-size: 11px; }
.chart .plan { stroke: var(--muted); stroke-width: 2; stroke-dasharray: 6 5; }
.chart .actual { stroke: var(--accent); stroke-width: 2.5; }
.chart .today { stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 3 3; }
.chart .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.sw { display: inline-block; width: 22px; height: 0; border-top: 3px solid var(--accent); }
.sw.plan { border-top: 2px dashed var(--muted); }
.scroll { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 520px; }
.tbl th { text-align: left; font-family: var(--font-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; border-bottom: 2px solid var(--line); padding: 6px 10px 6px 0; }
.tbl td { border-bottom: 1px solid var(--line); padding: 8px 10px 8px 0; vertical-align: top; }
.tbl td.num, .tbl td.win { font-family: var(--font-mono); font-size: 12.5px; white-space: nowrap; }
.tbl tr.done td { color: var(--muted); }
.tbl tr.active td { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.tbl tr.active td:first-child { box-shadow: inset 3px 0 0 var(--accent); padding-left: 8px; }

/* capstone */
.cap-head { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.cap-head h3 { margin: 2px 0 0; font-size: 19px; }
.cap-meta { display: flex; gap: 12px; align-items: center; }
.cap.complete { border-color: var(--done); }
.checks { list-style: none; margin: 14px 0 4px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.checks li { display: flex; gap: 10px; align-items: flex-start; }
.checks input { margin-top: 4px; accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
.checks label { cursor: pointer; }
.rules { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; align-items: center; }
.row .in { max-width: 320px; }
@media (prefers-reduced-motion: no-preference) { .bar span { transition: width .25s ease; } }
</style>

    <div class="top-in">
      <div class="brand"><h1>Backend Roadmap</h1><span>Java, Spring, distributed systems, PayVerse</span></div>
      <span id="savechip" data-k="wait" role="status">Connecting…</span>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>

  <main id="main"></main>

<script>
/* ===== ROADMAP DATA =====
   Row format: Category|Topic|What to learn[|hours]
   A leading + marks a topic added to fill a gap in the original roadmap.
   Default hours: 1.5 per topic, 10 per Practice row. */
const PH = {};
const PH_ORDER = [];
function defPhase(id, title, goal, prio, raw) {
  const topics = [];
  const seen = {};
  raw.trim().split('\n').forEach(function (line) {
    line = line.trim();
    if (!line) return;
    const isNew = line.charAt(0) === '+';
    if (isNew) line = line.slice(1);
    const p = line.split('|');
    let slug = p[1].toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    seen[slug] = (seen[slug] || 0) + 1;
    if (seen[slug] > 1) slug += '-' + seen[slug];
    const h = p[3] ? parseFloat(p[3]) : (p[0] === 'Practice' ? 10 : 1.5);
    topics.push({ id: id + ':' + slug, cat: p[0], name: p[1], desc: p[2], h: h, isNew: isNew, phase: id });
  });
  const hrs = topics.reduce(function (a, t) { return a + t.h; }, 0);
  PH[id] = { id: id, title: title, goal: goal, prio: prio, topics: topics, hrs: hrs };
  PH_ORDER.push(id);
}

defPhase('0', 'Foundations and Tooling',
  'Build, run and debug a multi-module project from the command line, and explain what happens on the wire for one HTTPS request.', 'core', `
+Dev Tooling|Git workflows|Branching, rebase vs merge, conflict resolution, interactive rebase, clean pull requests
+Dev Tooling|Linux and shell|Filesystem, permissions, processes, grep/sed/awk, curl, ssh, reading logs
+Dev Tooling|Maven and Gradle|Build lifecycle, dependency scopes, BOMs, multi-module builds, reproducible builds
+Dev Tooling|IDE and debugging|Breakpoints, remote debugging, conditional breakpoints, reading stack traces
+Networking|TCP/IP and DNS|Handshake, ports, name resolution, latency, connection reuse
+Networking|HTTP/1.1, HTTP/2 and HTTP/3|Keep-alive, multiplexing, head-of-line blocking, when the version matters
+Networking|TLS and certificates|Handshake, chain of trust, certificate expiry, mutual TLS concept
+Networking|Proxies, load balancers and CDNs|L4 vs L7, reverse proxy, TLS termination, edge caching
+Operating Systems|Processes, threads and scheduling|Context switches, CPU-bound vs I/O-bound work, what a thread costs
+Operating Systems|Virtual memory|Paging, page cache, swapping, why container memory differs from heap size
+Operating Systems|I/O models|Blocking vs non-blocking I/O, epoll, why thread-per-request scales the way it does
+Foundations|Big-O and core data structures|Complexity, arrays, hash maps, trees, heaps, applied to backend choices
+Practice|Tooling lab|Build a multi-module Maven project in Git, run it in a Linux container, and read a TLS handshake with curl|8
`);

defPhase('1', 'Java, Modern Java and Concurrency',
  'Build small Java exercises and explain trade-offs and internals; finish with a concurrent task processor.', 'core', `
Java Fundamentals|OOP foundations|Classes, objects, encapsulation, inheritance, polymorphism
Java Fundamentals|Interfaces vs abstract classes|When and why to use each; default/static interface methods
Java Fundamentals|Composition vs inheritance|Prefer composition where appropriate; coupling and reuse
Java Fundamentals|Generics|Type parameters, bounds, wildcards, PECS, type erasure
Java Fundamentals|Collections|List, Set, Map, Queue, Deque; implementations and tradeoffs
Java Fundamentals|equals/hashCode|Contract, collections behavior, mutable keys
Java Fundamentals|Immutability|Immutable objects, defensive copies, final fields
Java Fundamentals|Records|Record semantics and suitable use cases
Java Fundamentals|Enums|Enum behavior, fields, methods, strategy-like usage
Java Fundamentals|Exceptions|Checked vs unchecked, custom exceptions, propagation
Java Fundamentals|Annotations|Built-in/custom annotations and retention/target basics
Java Fundamentals|Reflection|Class metadata, methods, fields, invocation, tradeoffs
Java Fundamentals|Lambdas and functional interfaces|Function, Predicate, Consumer, Supplier, method references
Java Fundamentals|Streams|Intermediate/terminal operations, collectors, parallel-stream tradeoffs
Java Fundamentals|Optional|Good usage, anti-patterns, API design
Java Fundamentals|Date/Time API|Instant, LocalDateTime, ZonedDateTime, Duration, Period
+Java Fundamentals|Strings and text|String pool, StringBuilder, charsets, formatting, regex basics
+Java Fundamentals|I/O and NIO|Streams, Files, channels, buffers, try-with-resources
+Java Fundamentals|JDBC basics|Connections, PreparedStatement, manual transactions, why ORMs exist
Modern Java|Java 8 to 17 to 21+|Know major language/runtime improvements relevant to backend development
Modern Java|Sealed classes|Restricting inheritance and modeling closed hierarchies
Modern Java|Pattern matching|instanceof/switch pattern matching concepts
Modern Java|Virtual threads|Why they exist, when they help, blocking I/O model, tradeoffs
Modern Java|Structured concurrency concepts|Task lifecycles and cancellation concepts
Concurrency|Thread basics|Lifecycle, Runnable/Callable, interruption
Concurrency|synchronized|Intrinsic locks, monitor concept, visibility
Concurrency|volatile|Visibility and ordering; what it does not provide
+Concurrency|Java Memory Model|Happens-before, visibility guarantees, safe publication

function h(tag, a) {

      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
      else if (k === 'value' || k === 'checked' || k === 'selected' || k === 'disabled') e[k] = v;

}

async function flush() {

  busy = true;
  try {
    const keys = ['p', 'l'];
    for (let i = 0; i < keys.length; i++) {

      }

async function pull(first) {
  const r = await Promise.all([refs.p.get(), refs.l.get()]);
  let changed = false;
  const rp = r[0].exists ? r[0].data() : null;
  const rl = r[1].exists ? r[1].data() : null;
  if (rp && (+rp.u || 0) > (S.p.u || 0)) { S.p = normP(rp); changed = true; }
  else if (first && hasData('p') && (!rp || (S.p.u || 0) > (+rp.u || 0))) dirty.p = true;
  if (rl && (+rl.u || 0) > (S.l.u || 0)) { S.l = normL(rl); changed = true; }
  else if (first && hasData('l') && (!rl || (S.l.u || 0) > (+rl.u || 0))) dirty.l = true;

}

function planRows() {
  const bs = blocks();
  const hpw = S.p.cfg.hpw, start = S.p.cfg.start;
  let cum = 0;
  const rows = bs.map(function (b) {
    const from = addDays(start, Math.round(cum / hpw * 7));
    cum += b.hrs;
    const to = addDays(start, Math.max(0, Math.round(cum / hpw * 7) - 1));
    return { b: b, from: from, to: to };
  });
  return { rows: rows, total: cum, end: addDays(start, Math.ceil(cum / hpw * 7)) };
}

function svgEl(tag, a) { const e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in a) e.setAttribute(k, a[k]); return e; }
function timelineChart(plan, o) {
  const W = 640, H = 250, ml = 46, mr = 14, mt = 14, mb = 32;
  const cfg = S.p.cfg;
  const total = plan.total;
  const t = todayStr();
  const tw = daysBetween(cfg.start, t) / 7;
  const planWeeks = total / cfg.hpw;
  const xmax = Math.max(planWeeks, tw + 1);
  const X = function (w) { return ml + (Math.max(0, w) / xmax) * (W - ml - mr); };
  const Y = function (v) { return mt + (1 - v / total) * (H - mt - mb); };
  const svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'chart', role: 'img', 'aria-label': 'Planned versus actual cumulative hours' });
  for (let i = 0; i <= 4; i++) {
    const v = total * i / 4;
    svg.appendChild(svgEl('line', { x1: ml, x2: W - mr, y1: Y(v), y2: Y(v), class: 'grid' }));
    const tx = svgEl('text', { x: ml - 8, y: Y(v) + 4, class: 'axis', 'text-anchor': 'end' }); tx.textContent = Math.round(v) + ' h'; svg.appendChild(tx);
  }
  for (let i = 0; i <= 4; i++) {
    const w = xmax * i / 4;
    const tx = svgEl('text', { x: X(w), y: H - 10, class: 'axis', 'text-anchor': i === 0 ? 'start' : (i === 4 ? 'end' : 'middle') });
    tx.textContent = fmtDate(addDays(cfg.start, Math.round(w * 7)));
    svg.appendChild(tx);
  }
  svg.appendChild(svgEl('line', { x1: X(0), y1: Y(0), x2: X(planWeeks), y2: Y(total), class: 'plan' }));
  // actual: step curve from completion dates
  const ev = [];
  blocks().forEach(function (b) {
    if (b.kind === 'p') PH[b.id].topics.forEach(function (tp) { const r = peek(tp.id); if (r.s === 3 && r.d) ev.push({ d: r.d, h: tp.h }); });
    else { const cr = capPeek(b.id); if (cr.d) ev.push({ d: cr.d, h: b.hrs }); }
  });
  ev.sort(function (a, b) { return a.d < b.d ? -1 : 1; });
  let cum = 0;
  let path = 'M' + X(0) + ' ' + Y(0);
  ev.forEach(function (e) {
    const w = daysBetween(cfg.start, e.d) / 7;
    path += ' L' + X(w) + ' ' + Y(cum);
    cum += e.h;
    path += ' L' + X(w) + ' ' + Y(cum);
  });
  path += ' L' + X(tw) + ' ' + Y(cum);
  svg.appendChild(svgEl('path', { d: path, class: 'actual', fill: 'none' }));
  if (tw >= 0) {
    svg.appendChild(svgEl('line', { x1: X(tw), x2: X(tw), y1: mt, y2: H - mb, class: 'today' }));
    svg.appendChild(svgEl('circle', { cx: X(tw), cy: Y(cum), r: 4, class: 'dot' }));
    const lb = svgEl('text', { x: X(tw) + (X(tw) > W - 80 ? -6 : 6), y: mt + 10, class: 'axis', 'text-anchor': X(tw) > W - 80 ? 'end' : 'start' });
    lb.textContent = 'Today'; svg.appendChild(lb);
  }
  const legend = h('div', { class: 'legend' },
    h('span', null, h('i', { class: 'sw plan' }), 'Planned at ' + cfg.hpw + ' h/week'),
    h('span', null, h('i', { class: 'sw actual' }), 'Completed (' + fmtH(cum) + ' h)'));
  return h('div', { class: 'chartwrap' }, svg, legend);
}

function viewData() {
  const root = h('div', { class: 'view' });
  root.appendChild(h('section', { class: 'panel' },
    h('h3', null, 'Where your progress lives'),
    h('p', { class: 'sub', text: ui.saveState === 'cloud' ? 'Saved to your account and also cached on this device. Open the page on another device and it loads the same progress.' : 'Saved on this device in this browser. If you open the page signed in to Claude, progress also saves to your account.' })));

  root.appendChild(h('section', { class: 'panel' },
    h('h3', null, 'How completion works'),
    h('ul', { class: 'rules' },
      h('li', null, h('strong', { text: 'Done needs evidence. ' }), 'Write what proves it: a repo link, a test name, or the question you answered from memory.'),
      h('li', null, h('strong', { text: 'Reviews come back. ' }), 'A done topic returns for review after 3, 10, 30 and 90 days. Forgetting resets its cycle.'),
      h('li', null, h('strong', { text: 'Capstone levels need a link. ' }), 'Tick every acceptance check and link the code.'),
      h('li', null, h('strong', { text: 'Hours are estimates. ' }), 'Topics default to 1.5 h and labs to 8 to 14 h. The timeline compares them with what you finish.'))));

  const msg = h('p', { class: 'msg ok', id: 'data-msg', role: 'status' });
  const exp = h('button', {
    type: 'button', class: 'btn primary', onclick: async function () {
      try {
        const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
        if (!dl) { msg.textContent = 'Saving files is not available in this view. Copy the backup text below instead.'; $('data-text').hidden = false; $('data-text').value = JSON.stringify({ p: S.p, l: S.l }); return; }
        await dl.save({ filename: 'backend-roadmap-progress-' + todayStr() + '.json', data: JSON.stringify({ app: 'backend-roadmap-tracker', v: 1, p: S.p, l: S.l }, null, 1) });
        msg.textContent = 'Backup saved.';
      } catch (e) { msg.textContent = e && e.code === 'declined' ? 'Backup cancelled.' : 'Could not save the backup here.'; }
    }
  }, 'Export backup (JSON)');
  const file = h('input', { id: 'imp-file', type: 'file', accept: '.json,application/json', class: 'in', 'aria-label': 'Choose backup file' });
  const imp = h('button', {
    type: 'button', class: 'btn', onclick: function () {
      const f = file.files && file.files[0];
      if (!f) { msg.textContent = 'Choose a backup file first.'; return; }
      const rd = new FileReader();
      rd.onload = function () {
        try {
          const d = JSON.parse(rd.result);
          if (!d || !d.p || typeof d.p.topics !== 'object') throw new Error('bad');
          ui.confirm = { kind: 'import', data: d };
          render();
        } catch (e) { msg.textContent = 'That file is not a backup from this tracker.'; }
      };
      rd.readAsText(f);
    }
  }, 'Import backup');
  const ta = h('textarea', { id: 'data-text', class: 'in', rows: '4', hidden: true, readonly: true, 'aria-label': 'Backup text' });
  root.appendChild(h('section', { class: 'panel' }, h('h3', null, 'Backup'), h('div', { class: 'row' }, exp), h('div', { class: 'row' }, file, imp), ta, msg));

  const danger = h('section', { class: 'panel' }, h('h3', null, 'Reset'));
  if (ui.confirm) {
    const c = ui.confirm;
    danger.appendChild(h('p', { class: 'msg', role: 'alert', text: c.kind === 'import' ? 'Importing replaces all progress and the log on this account with the file. Continue?' : 'This erases every status, note, evidence entry, capstone tick and log entry. It cannot be undone. Continue?' }));
    danger.appendChild(h('div', { class: 'row' },
      h('button', {
        type: 'button', class: 'btn danger', onclick: function () {
          if (c.kind === 'import') { S.p = normP(c.data.p); S.l = normL(c.data.l); }
          else { S.p = normP({ cfg: S.p.cfg }); S.l = normL(null); }
          dirty.p = true; dirty.l = true; touch('p'); touch('l'); ui.confirm = null; ui.open.clear(); render();
        }
      }, c.kind === 'import' ? 'Yes, replace everything' : 'Yes, erase everything'),
      h('button', { type: 'button', class: 'btn', onclick: function () { ui.confirm = null; render(); } }, 'Cancel')));
  } else {
    danger.appendChild(h('p', { class: 'sub', text: 'Start over with an empty tracker. Your plan settings stay.' }));
    danger.appendChild(h('button', { type: 'button', class: 'btn danger', onclick: function () { ui.confirm = { kind: 'reset' }; render(); } }, 'Reset all progress'));
  }
  root.appendChild(danger);
  return root;
}

/* ===== RENDER ===== */
function render() {
  const nav = $('tabs');
  nav.textContent = '';
  TABS.forEach(function (tb) {
    nav.appendChild(h('button', {
      type: 'button', class: 'tab' + (ui.tab === tb[0] ? ' on' : ''), 'aria-current': ui.tab === tb[0] ? 'page' : null, onclick: function () {
        ui.tab = tb[0]; ui.msg = '';
        try { history.replaceState(null, '', '#' + tb[0]); } catch (e) { /* hash unavailable */ }
        render(); window.scrollTo(0, 0);
      }
    }, tb[1]));
  });
  const views = { today: viewToday, roadmap: viewRoadmap, timeline: viewTimeline, capstone: viewCapstone, log: viewLog, data: viewData };
  const main = $('main');
  main.textContent = '';
  main.appendChild(views[ui.tab]());
  setSave(ui.saveState);
  if (ui.flash) {
    const el = $('ev-' + ui.flash);
    if (el) { el.focus(); }
    ui.flash = null;
  }
}

/* ===== BOOT ===== */
(function boot() {
  const saved = lsLoad();
  if (saved) { S.p = normP(saved.p); S.l = normL(saved.l); }
  else S.p = normP(null);
  if (!S.p.cfg.start) S.p.cfg.start = nextMonday();
  try { const hsh = location.hash.replace('#', ''); if (TABS.some(function (x) { return x[0] === hsh; })) ui.tab = hsh; } catch (e) { /* no hash */ }
  render();
  initDb();
})();
</script>

</body></html>
