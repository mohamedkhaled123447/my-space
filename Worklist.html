<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one focused column — a header with today's date, a quick-add bar, then tasks grouped by when they're due. */
:root {
  --bg: #eceff4;
  --surface: #ffffff;
  --ink: #1a2232;
  --muted: #5d6779;
  --line: #d6dbe5;
  --accent: #2f56e0;
  --accent-ink: #ffffff;
  --accent-soft: #e3e9fc;
  --hot: #c9661b;
  --hot-soft: #fbeadb;
  --late: #c43d3d;
  --ok: #2a8457;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151d; --surface: #191f2a; --ink: #e5e9f1; --muted: #98a2b4; --line: #2b3342;
    --accent: #7d99ff; --accent-ink: #0e1320; --accent-soft: #232d48;
    --hot: #f0a25f; --hot-soft: #3a2a1c; --late: #f07a7a; --ok: #5cc28f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151d; --surface: #191f2a; --ink: #e5e9f1; --muted: #98a2b4; --line: #2b3342;
  --accent: #7d99ff; --accent-ink: #0e1320; --accent-soft: #232d48;
  --hot: #f0a25f; --hot-soft: #3a2a1c; --late: #f07a7a; --ok: #5cc28f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 var(--font-body);
  padding-inline: 16px;
  padding-block: 32px 64px;
}
.wrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.date-eyebrow {
  font: 500 12px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
h1 {
  font: 800 clamp(34px, 7vw, 48px)/1 var(--font-display);
  letter-spacing: -.02em; margin: 6px 0 0; text-wrap: balance;
}
h1 span { color: var(--accent); }
.tally { display: flex; gap: 18px; font-variant-numeric: tabular-nums; }
.tally div { display: flex; flex-direction: column; align-items: flex-end; }
.tally b { font: 600 22px/1 var(--font-display); }
.tally small { font: 500 11px/1.6 var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tally .is-late b { color: var(--late); }

.progress { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .4s ease; }

/* Quick add */
form.add {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 8px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  box-shadow: 0 1px 0 var(--line), 0 8px 24px -16px rgba(20, 30, 60, .35);
}
form.add input[type="text"] {
  flex: 1 1 220px; min-width: 0; border: 0; background: transparent; color: var(--ink);
  font: 500 16px var(--font-body); padding: 10px 10px; outline: none;
}
form.add input[type="text"]::placeholder { color: var(--muted); }
.add-opts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.field {
  display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 10px;
  border: 1px solid var(--line); border-radius: 8px; color: var(--muted);
  font: 500 13px var(--font-body); background: var(--bg); cursor: pointer;
}
.field input[type="date"] {
  border: 0; background: transparent; color: var(--ink); font: 500 13px var(--font-mono); outline: none; width: 128px;
}
.pri-toggle[aria-pressed="true"] { background: var(--hot-soft); color: var(--hot); border-color: var(--hot); }
.btn-add {
  height: 38px; padding: 0 18px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink);
  font: 600 14px var(--font-body); cursor: pointer;
}
.btn-add:hover { filter: brightness(1.08); }
button { font-family: inherit; }
button:focus-visible, input:focus-visible, .field:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Toolbar */
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.tabs { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
.tabs button {
  border: 0; background: transparent; color: var(--muted); font: 600 13px var(--font-body);
  padding: 6px 14px; border-radius: 6px; cursor: pointer;
}
.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
.linkish { border: 0; background: none; color: var(--muted); font: 500 13px var(--font-body); cursor: pointer; padding: 6px 4px; }
.linkish:hover { color: var(--ink); text-decoration: underline; }

.notice {
  display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap;
  background: var(--accent-soft); color: var(--ink); border-radius: var(--radius); padding: 10px 14px; font-size: 14px;
}
.notice button { border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 7px; padding: 5px 12px; font: 600 13px var(--font-body); cursor: pointer; }

/* Groups */
.groups { display: flex; flex-direction: column; gap: 22px; }
.group h2 {
  display: flex; align-items: baseline; gap: 8px; margin: 0 0 8px;
  font: 500 12px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
}
.group h2 .n { color: var(--ink); }
.group.late h2 { color: var(--late); }
ul.tasks { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
li.task {
  display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
  padding: 11px 12px 11px 14px; border-top: 1px solid var(--line);
  position: relative;
}
li.task:first-child { border-top: 0; }
li.task.high::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--hot); }

.check {
  width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); background: transparent;
  display: grid; place-items: center; cursor: pointer; padding: 0; color: transparent; transition: background .15s, border-color .15s;
}
.check:hover { border-color: var(--accent); }
.check svg { width: 12px; height: 12px; }
li.task.done .check { background: var(--ok); border-color: var(--ok); color: var(--surface); }

.body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.text { overflow-wrap: anywhere; cursor: text; font-weight: 500; }
li.task.done .text { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--muted); }
.meta { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  font: 500 11px/1 var(--font-mono); padding: 4px 7px; border-radius: 5px; background: var(--bg); color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.chip.late { color: var(--late); background: transparent; border: 1px solid currentColor; padding: 3px 6px; }
.chip.today { color: var(--accent); background: var(--accent-soft); }
.chip.hot { color: var(--hot); background: var(--hot-soft); }
.chip.ex { border: 1px dashed var(--line); background: transparent; }
.edit-input {
  width: 100%; font: 500 15px var(--font-body); color: var(--ink); background: var(--bg);
  border: 1px solid var(--accent); border-radius: 6px; padding: 5px 8px; outline: none;
}

.actions { display: flex; gap: 2px; opacity: .55; transition: opacity .15s; }
li.task:hover .actions, li.task:focus-within .actions { opacity: 1; }
.icon-btn {
  width: 32px; height: 32px; display: grid; place-items: center; border: 0; background: transparent;
  color: var(--muted); border-radius: 7px; cursor: pointer;
}
.icon-btn:hover { background: var(--bg); color: var(--ink); }
.icon-btn.flag[aria-pressed="true"] { color: var(--hot); }
.icon-btn.del:hover { color: var(--late); }
.icon-btn svg { width: 16px; height: 16px; }

.empty {
  text-align: center; padding: 40px 16px; color: var(--muted); background: var(--surface);
  border: 1px dashed var(--line); border-radius: var(--radius);
}
.empty strong { display: block; color: var(--ink); font: 600 18px var(--font-display); margin-bottom: 4px; }

footer { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; }
.sync { display: inline-flex; align-items: center; gap: 6px; font: 500 12px var(--font-mono); }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync.cloud i { background: var(--ok); }
kbd { font: 500 11px var(--font-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; background: var(--surface); }

.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--bg); padding: 10px 10px 10px 16px; border-radius: 10px;
  display: flex; gap: 14px; align-items: center; font-size: 14px; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s; max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
.toast button { border: 0; background: transparent; color: var(--bg); font: 600 13px var(--font-body); text-decoration: underline; cursor: pointer; padding: 4px 6px; }

@media (max-width: 480px) {
  .tally { gap: 14px; }
  .field input[type="date"] { width: 118px; }
  .actions { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div>
      <div class="date-eyebrow" id="today-label">Today</div>
      <h1>Work<span>list</span></h1>
    </div>
    <div class="tally" aria-live="polite">
      <div><b id="t-open">0</b><small>Open</small></div>
      <div id="t-late-wrap"><b id="t-late">0</b><small>Overdue</small></div>
      <div><b id="t-done">0</b><small>Done</small></div>
    </div>
  </header>

  <div class="progress" aria-hidden="true"><i id="bar"></i></div>

  <form class="add" id="add-form" autocomplete="off">
    <label for="new-text" class="sr" hidden>New task</label>
    <input type="text" id="new-text" placeholder="Add a task, e.g. Send Q4 budget to finance" maxlength="300">
    <div class="add-opts">
      <label class="field" for="new-due" title="Due date">
        Due <input type="date" id="new-due">
      </label>
      <button type="button" class="field pri-toggle" id="new-pri" aria-pressed="false" title="Mark as high priority">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h11l-2 4 2 4H5"/></svg>
        Priority
      </button>
      <button type="submit" class="btn-add" id="add-btn">Add</button>
    </div>
  </form>

  <div class="notice" id="example-notice" hidden>
    <span>These are example tasks to show how the list works.</span>
    <button type="button" id="clear-examples">Clear examples</button>
  </div>

  <div class="toolbar">
    <div class="tabs" role="tablist" aria-label="Filter tasks">
      <button type="button" role="tab" data-filter="active" id="tab-active" aria-selected="true">To do</button>
      <button type="button" role="tab" data-filter="all" id="tab-all" aria-selected="false">All</button>
      <button type="button" role="tab" data-filter="done" id="tab-done" aria-selected="false">Done</button>
    </div>
    <button type="button" class="linkish" id="clear-done">Clear completed</button>
  </div>

  <div class="groups" id="groups"></div>

  <footer>
    <span class="sync" id="sync"><i></i><span id="sync-text">Loading…</span></span>
    <span><kbd>N</kbd> new task · <kbd>Enter</kbd> add · double-click to edit</span>
  </footer>
</div>

<div class="toast" id="toast" role="status"><span id="toast-text"></span><button type="button" id="toast-undo">Undo</button></div>

<script src="store.js"></script>
<script>
(() => {
  const STORE_KEY = "worklist";
  const $ = (id) => document.getElementById(id);
  const DAY = 86400000;

  // ---------- dates ----------
  const pad = (n) => String(n).padStart(2, "0");
  const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayISO = () => iso(new Date());
  const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
  const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const diffDays = (s) => Math.round((parse(s) - parse(todayISO())) / DAY);
  function isoWeek(date) {
    const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const day = d.getUTCDay() || 7; d.setUTCDate(d.getUTCDate() + 4 - day);
    const y0 = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    return Math.ceil(((d - y0) / DAY + 1) / 7);
  }
  function dueLabel(s) {
    const n = diffDays(s);
    if (n === 0) return "Today";
    if (n === 1) return "Tomorrow";
    if (n === -1) return "Yesterday";
    if (n < 0) return `${-n} days late`;
    const d = parse(s);
    const opts = n < 7 ? { weekday: "short" } : { day: "numeric", month: "short" };
    return d.toLocaleDateString(undefined, opts);
  }

  // ---------- state ----------
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  function exampleItems() {
    const now = Date.now();
    return [
      { id: uid(), text: "Reply to the client about the revised timeline", done: false, due: addDays(-1), pri: "high", created: now - 5, ex: true },
      { id: uid(), text: "Prepare slides for Thursday's team sync", done: false, due: todayISO(), pri: "normal", created: now - 4, ex: true },
      { id: uid(), text: "Review Ahmed's pull request", done: false, due: todayISO(), pri: "high", created: now - 3, ex: true },
      { id: uid(), text: "Book meeting room for the quarterly review", done: false, due: addDays(3), pri: "normal", created: now - 2, ex: true },
      { id: uid(), text: "Update the onboarding checklist", done: false, due: "", pri: "normal", created: now - 1, ex: true },
      { id: uid(), text: "Submit last week's timesheet", done: true, due: addDays(-2), pri: "normal", created: now - 6, doneAt: now - 1000, ex: true },
    ];
  }

  let items = [];
  let filter = "active";
  let editingId = null;
  let lastRemoved = null;

  // ---------- storage (JSON server, see store.js) ----------
  function setSync(ok, text) {
    $("sync").classList.toggle("cloud", ok);
    $("sync-text").textContent = text;
  }
  Store.onStatus((s) => {
    if (s === "saving") setSync(true, "Saving…");
    else if (s === "saved") setSync(true, "Saved to server");
    else setSync(false, "Server unreachable — retrying");
  });
  // Nothing is written until the saved list has loaded, so a server outage can never overwrite it.
  let loaded = false;
  function save() { if (loaded) Store.save(STORE_KEY, { items }); }

  // ---------- actions ----------
  function addTask(text, due, pri) {
    text = text.trim();
    if (!text) return false;
    items.push({ id: uid(), text, done: false, due: due || "", pri: pri ? "high" : "normal", created: Date.now() });
    save(); render(); return true;
  }
  function update(id, patch) {
    const t = items.find(x => x.id === id); if (!t) return;
    Object.assign(t, patch); save(); render();
  }
  function remove(id) {
    const i = items.findIndex(x => x.id === id); if (i < 0) return;
    lastRemoved = { list: [items[i]], idx: [i] };
    items.splice(i, 1); save(); render();
    toast("Task deleted");
  }

  // ---------- rendering ----------
  const ICONS = {
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h11l-2 4 2 4H5"/></svg>',
    flagFill: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h11l-2 4 2 4H5"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>',
    del: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  };

  function sortTasks(a, b) {
    if (a.done !== b.done) return a.done ? 1 : -1;
    if (a.done) return (b.doneAt || 0) - (a.doneAt || 0);
    if (a.pri !== b.pri) return a.pri === "high" ? -1 : 1;
    if (a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1;
    return a.created - b.created;
  }

  function groupOf(t) {
    if (t.done) return "done";
    if (!t.due) return "someday";
    const n = diffDays(t.due);
    if (n < 0) return "late";
    if (n === 0) return "today";
    if (n <= 7) return "week";
    return "later";
  }
  const GROUPS = [
    ["late", "Overdue"], ["today", "Today"], ["week", "Next 7 days"],
    ["later", "Later"], ["someday", "No due date"], ["done", "Completed"],
  ];

  function taskEl(t) {
    const li = document.createElement("li");
    li.className = "task" + (t.done ? " done" : "") + (t.pri === "high" && !t.done ? " high" : "");
    li.dataset.id = t.id;

    const chk = document.createElement("button");
    chk.type = "button"; chk.className = "check"; chk.innerHTML = ICONS.check;
    chk.setAttribute("aria-label", t.done ? "Mark as not done" : "Mark as done");
    chk.addEventListener("click", () => update(t.id, { done: !t.done, doneAt: t.done ? null : Date.now() }));

    const body = document.createElement("div"); body.className = "body";
    if (editingId === t.id) {
      const inp = document.createElement("input");
      inp.className = "edit-input"; inp.value = t.text; inp.id = "edit-" + t.id; inp.maxLength = 300;
      inp.setAttribute("aria-label", "Edit task");
      const finish = (commit) => {
        if (editingId !== t.id) return;
        editingId = null;
        const v = inp.value.trim();
        if (commit && v && v !== t.text) update(t.id, { text: v }); else render();
      };
      inp.addEventListener("keydown", (e) => { if (e.key === "Enter") finish(true); if (e.key === "Escape") finish(false); });
      inp.addEventListener("blur", () => finish(true));
      body.appendChild(inp);
      requestAnimationFrame(() => { inp.focus(); inp.select(); });
    } else {
      const txt = document.createElement("div"); txt.className = "text"; txt.textContent = t.text;
      txt.addEventListener("dblclick", () => { editingId = t.id; render(); });
      body.appendChild(txt);
    }
    const meta = document.createElement("div"); meta.className = "meta";
    if (t.due) {
      const c = document.createElement("span"); const n = diffDays(t.due);
      c.className = "chip" + (!t.done && n < 0 ? " late" : !t.done && n === 0 ? " today" : "");
      c.textContent = dueLabel(t.due); c.title = parse(t.due).toLocaleDateString(undefined, { dateStyle: "full" });
      meta.appendChild(c);
    }
    if (t.pri === "high" && !t.done) { const c = document.createElement("span"); c.className = "chip hot"; c.textContent = "Priority"; meta.appendChild(c); }
    if (t.ex) { const c = document.createElement("span"); c.className = "chip ex"; c.textContent = "Example"; meta.appendChild(c); }
    if (meta.children.length) body.appendChild(meta);

    const act = document.createElement("div"); act.className = "actions";
    const flag = document.createElement("button");
    flag.type = "button"; flag.className = "icon-btn flag"; flag.setAttribute("aria-pressed", String(t.pri === "high"));
    flag.setAttribute("aria-label", t.pri === "high" ? "Remove priority" : "Mark as priority"); flag.title = flag.getAttribute("aria-label");
    flag.innerHTML = t.pri === "high" ? ICONS.flagFill : ICONS.flag;
    flag.addEventListener("click", () => update(t.id, { pri: t.pri === "high" ? "normal" : "high" }));

    const date = document.createElement("label");
    date.className = "icon-btn"; date.title = "Change due date"; date.style.position = "relative";
    date.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>';
    const di = document.createElement("input");
    di.type = "date"; di.value = t.due || ""; di.id = "due-" + t.id; di.setAttribute("aria-label", "Due date");
    di.style.cssText = "position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;";
    di.addEventListener("change", () => update(t.id, { due: di.value }));
    date.appendChild(di);

    const ed = document.createElement("button");
    ed.type = "button"; ed.className = "icon-btn"; ed.innerHTML = ICONS.edit; ed.setAttribute("aria-label", "Edit task"); ed.title = "Edit";
    ed.addEventListener("click", () => { editingId = t.id; render(); });

    const del = document.createElement("button");
    del.type = "button"; del.className = "icon-btn del"; del.innerHTML = ICONS.del; del.setAttribute("aria-label", "Delete task"); del.title = "Delete";
    del.addEventListener("click", () => remove(t.id));

    act.append(flag, date, ed, del);
    li.append(chk, body, act);
    return li;
  }

  function render() {
    const now = new Date();
    $("today-label").textContent = now.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" }) + " · Week " + isoWeek(now);

    const open = items.filter(t => !t.done);
    const late = open.filter(t => t.due && diffDays(t.due) < 0);
    const done = items.length - open.length;
    $("t-open").textContent = open.length;
    $("t-late").textContent = late.length;
    $("t-late-wrap").classList.toggle("is-late", late.length > 0);
    $("t-done").textContent = done;
    $("bar").style.width = items.length ? (done / items.length * 100) + "%" : "0%";
    $("example-notice").hidden = !items.some(t => t.ex);
    $("clear-done").hidden = done === 0;

    document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.filter === filter)));

    const visible = items.filter(t => filter === "all" || (filter === "done" ? t.done : !t.done)).sort(sortTasks);
    const host = $("groups");
    host.textContent = "";

    if (!visible.length) {
      const e = document.createElement("div"); e.className = "empty";
      const s = document.createElement("strong");
      if (filter === "done") { s.textContent = "Nothing completed yet"; e.append(s, "Tick off a task and it shows up here."); }
      else if (items.length) { s.textContent = "All clear"; e.append(s, "Every task is done. Add the next one above."); }
      else { s.textContent = "No tasks yet"; e.append(s, "Type your first task above and press Enter."); }
      host.appendChild(e); return;
    }

    const by = {};
    visible.forEach(t => (by[groupOf(t)] ||= []).push(t));
    for (const [key, label] of GROUPS) {
      const list = by[key]; if (!list) continue;
      const sec = document.createElement("section"); sec.className = "group " + key;
      const h = document.createElement("h2");
      h.innerHTML = `<span></span><span class="n"></span>`;
      h.firstChild.textContent = label; h.lastChild.textContent = list.length;
      const ul = document.createElement("ul"); ul.className = "tasks";
      list.forEach(t => ul.appendChild(taskEl(t)));
      sec.append(h, ul); host.appendChild(sec);
    }
  }

  // ---------- toast ----------
  let toastTimer = null;
  function toast(msg) {
    $("toast-text").textContent = msg;
    $("toast").classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $("toast").classList.remove("show"); lastRemoved = null; }, 5000);
  }
  $("toast-undo").addEventListener("click", () => {
    if (lastRemoved) {
      lastRemoved.list.forEach((t, k) => items.splice(Math.min(lastRemoved.idx[k], items.length), 0, t));
      lastRemoved = null; save(); render();
    }
    $("toast").classList.remove("show");
  });

  // ---------- wiring ----------
  let newPri = false;
  $("new-pri").addEventListener("click", () => { newPri = !newPri; $("new-pri").setAttribute("aria-pressed", String(newPri)); });
  $("add-form").addEventListener("submit", (e) => {
    e.preventDefault();
    if (addTask($("new-text").value, $("new-due").value, newPri)) {
      $("new-text").value = ""; $("new-due").value = "";
      newPri = false; $("new-pri").setAttribute("aria-pressed", "false");
      if (filter === "done") filter = "active", render();
    }
    $("new-text").focus();
  });
  document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => { filter = b.dataset.filter; render(); }));
  $("clear-done").addEventListener("click", () => {
    const idx = [], list = [];
    items.forEach((t, i) => { if (t.done) { idx.push(i); list.push(t); } });
    if (!list.length) return;
    items = items.filter(t => !t.done);
    lastRemoved = { list, idx }; save(); render();
    toast(`Cleared ${list.length} completed ${list.length === 1 ? "task" : "tasks"}`);
  });
  $("clear-examples").addEventListener("click", () => { items = items.filter(t => !t.ex); save(); render(); $("new-text").focus(); });
  document.addEventListener("keydown", (e) => {
    const tag = (e.target.tagName || "").toLowerCase();
    if (e.key.toLowerCase() === "n" && !e.metaKey && !e.ctrlKey && !e.altKey && tag !== "input" && tag !== "textarea") {
      e.preventDefault(); $("new-text").focus();
    }
  });
  // Roll the groups over at midnight / when returning to the tab.
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !editingId) render(); });

  // ---------- boot ----------
  setSync(false, "Loading…");
  Store.load(STORE_KEY).then((v) => {
    loaded = true;
    items = v && Array.isArray(v.items) ? v.items : exampleItems();
    setSync(true, "Saved to server");
  }).catch(() => {
    items = exampleItems();
    setSync(false, "Server unreachable — changes won't be saved");
  }).then(render);
})();
</script>

</body></html>
