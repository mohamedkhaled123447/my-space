<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: fixed sidebar for navigation; main area shows an overview (home) or the selected page in a frame. */
:root {
  --bg: #f2f4f8;
  --side: #ffffff;
  --surface: #ffffff;
  --line: #dde2ea;
  --fg: #151b26;
  --muted: #5f6979;
  --accent: #2f56e0;
  --accent-soft: rgba(47, 86, 224, .1);
  --shadow: 0 1px 2px rgba(20, 27, 38, .05), 0 4px 16px rgba(20, 27, 38, .05);
  --c-mushaf: #1d5a50;
  --c-work: #2f56e0;
  --c-recall: #d6453d;
  --c-road: #7a4fd1;
  --c-plan: #c2572b;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --side-w: 248px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218; --side: #151a22; --surface: #181e27; --line: #283041;
    --fg: #e7ebf2; --muted: #95a0b3; --accent: #7f9cff; --accent-soft: rgba(127, 156, 255, .14);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    --c-mushaf: #74b6a6; --c-work: #7f9cff; --c-recall: #f08a7e; --c-road: #b597f2; --c-plan: #ec8a5e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1218; --side: #151a22; --surface: #181e27; --line: #283041;
  --fg: #e7ebf2; --muted: #95a0b3; --accent: #7f9cff; --accent-soft: rgba(127, 156, 255, .14);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  --c-mushaf: #74b6a6; --c-work: #7f9cff; --c-recall: #f08a7e; --c-road: #b597f2; --c-plan: #ec8a5e;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--f-body); }
a { color: inherit; }
button { font: inherit; color: inherit; }

/* Sidebar */
.side {
  position: fixed; inset: 0 auto 0 0; width: var(--side-w);
  background: var(--side); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; padding: 18px 12px; z-index: 20;
  transition: transform .2s ease;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; font: 700 18px var(--f-display); text-decoration: none; }
.brand .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 15px; }
.nav-label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 10px 10px 6px; }
nav ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
nav a {
  display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 8px;
  text-decoration: none; color: var(--muted); font-weight: 500;
}
nav a:hover { background: var(--accent-soft); color: var(--fg); }
nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
nav a svg { width: 18px; height: 18px; flex: none; }
nav a .badge { margin-left: auto; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 10px; background: var(--accent); color: #fff; }
nav a .badge:empty { display: none; }
.side-foot { margin-top: auto; display: flex; gap: 8px; padding: 10px 6px 0; border-top: 1px solid var(--line); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  padding: 7px 12px; cursor: pointer; font-size: 13px; font-weight: 500; text-decoration: none;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn svg { width: 16px; height: 16px; }
.side-foot .btn { flex: 1; }

/* Main */
.main { margin-left: var(--side-w); min-height: 100%; display: flex; flex-direction: column; }
.topbar { display: none; }
.home { padding: 32px 36px 48px; max-width: 1100px; width: 100%; }
.home h1 { font: 700 30px/1.15 var(--f-display); margin: 0 0 4px; }
.home .sub { color: var(--muted); margin: 0 0 28px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 28px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); }
.stat small { color: var(--muted); font-size: 12px; font-weight: 500; }
.stat b { display: block; font: 700 28px/1.2 var(--f-display); margin-top: 4px; font-variant-numeric: tabular-nums; }

.section-title { font: 600 16px var(--f-display); margin: 0 0 12px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.card {
  position: relative; display: flex; flex-direction: column; gap: 10px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 20px; text-decoration: none; box-shadow: var(--shadow);
  transition: transform .15s ease, border-color .15s ease;
}
.card:hover { transform: translateY(-2px); border-color: var(--c); }
.card .ic { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
.card .ic svg { width: 20px; height: 20px; }
.card h3 { margin: 0; font: 600 17px var(--f-display); }
.card p { margin: 0; color: var(--muted); font-size: 13px; }
.card .meta { margin-top: auto; padding-top: 8px; font-size: 12px; font-weight: 500; color: var(--c); }

/* Framed page view */
.view { flex: 1; display: none; flex-direction: column; min-height: 100vh; }
.view-bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--side); }
.view-bar h2 { margin: 0; font: 600 15px var(--f-display); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.view iframe { flex: 1; width: 100%; border: 0; background: var(--bg); }
body.framed .home { display: none; }
body.framed .view { display: flex; }

/* Mobile: sidebar becomes a drawer */
.scrim { display: none; }
@media (max-width: 860px) {
  .side { transform: translateX(-100%); box-shadow: var(--shadow); }
  body.nav-open .side { transform: none; }
  body.nav-open .scrim { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, .35); z-index: 15; }
  .main { margin-left: 0; }
  .topbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--side); position: sticky; top: 0; z-index: 10; }
  .topbar b { font: 700 16px var(--f-display); }
  .home { padding: 20px 16px 40px; }
  .home h1 { font-size: 24px; }
  .view { min-height: calc(100vh - 53px); }
}
</style>
</head>
<body>

<aside class="side" id="side">
  <a class="brand" href="#home"><span class="logo">✦</span> My Space</a>
  <nav>
    <div class="nav-label">Overview</div>
    <ul>
      <li><a href="#home" data-route="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard</a></li>
    </ul>
    <div class="nav-label">Pages</div>
    <ul id="navPages"></ul>
  </nav>
  <div class="side-foot">
    <button class="btn" id="themeBtn" type="button">Theme: Auto</button>
  </div>
</aside>
<div class="scrim" id="scrim"></div>

<div class="main">
  <header class="topbar">
    <button class="btn" id="menuBtn" type="button" aria-label="Open navigation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <b>My Space</b>
  </header>

  <section class="home" id="home">
    <h1 id="greet">Welcome back</h1>
    <p class="sub" id="today"></p>

    <div class="stats">
      <div class="stat"><small>Today's plan</small><b id="st-plan">–</b></div>
      <div class="stat"><small>Open tasks</small><b id="st-tasks">–</b></div>
      <div class="stat"><small>Cards due today</small><b id="st-cards">–</b></div>
      <div class="stat"><small>Roadmap topics done</small><b id="st-road">–</b></div>
    </div>

    <h2 class="section-title">Your pages</h2>
    <div class="cards" id="cards"></div>
  </section>

  <section class="view" id="view">
    <div class="view-bar">
      <h2 id="viewTitle"></h2>
      <a class="btn" id="newTab" target="_blank" rel="noopener" title="Open in new tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
        <span>New tab</span>
      </a>
    </div>
    <iframe id="frame" title="Page"></iframe>
  </section>
</div>

<script src="store.js"></script>
<script>
const ICONS = {
  book: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h7"/>',
  check: '<rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 12 3 3 5-6"/>',
  cards: '<rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/>',
  calendar: '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M7 13h4M7 17h7"/>',
  route: '<circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h8a3 3 0 0 0 0-6H8a3 3 0 0 1 0-6h8"/>'
};
const PAGES = [
  { id: "planner", title: "Daily Planner", file: "Daily Planner.html", icon: "calendar", color: "var(--c-plan)", desc: "Priorities, tasks and an hourly schedule for each day." },
  { id: "mushaf", title: "Hifz Mushaf", file: "mushaf.html", icon: "book", color: "var(--c-mushaf)", desc: "Read and memorize the Quran page by page." },
  { id: "mushaf-local", title: "Hifz Mushaf (Local)", file: "mushaf-local.html", icon: "book", color: "var(--c-mushaf)", desc: "The same mushaf, saved in this browser only." },
  { id: "worklist", title: "Worklist", file: "Worklist.html", icon: "check", color: "var(--c-work)", desc: "Tasks grouped by when they're due." },
  { id: "recall", title: "Recall Deck", file: "Recall Deck.html", icon: "cards", color: "var(--c-recall)", desc: "Spaced-repetition flashcards." },
  { id: "roadmap", title: "Backend Roadmap", file: "Backend Roadmap Tracker.html", icon: "route", color: "var(--c-road)", desc: "Track progress through the backend learning path." }
];
const svg = name => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ICONS[name] + '</svg>';
const $ = id => document.getElementById(id);

// Stats come from the other pages' saved state on the JSON server, so they stay in sync.
async function stats() {
  const out = {};
  let all = {};
  try { all = await Store.loadAll(); } catch (e) { /* server unreachable: show dashes */ }

  const pl = all.planner;
  const today = (() => { const d = new Date(), p = n => String(n).padStart(2, "0"); return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()); })();
  const pd = pl && pl.days && pl.days[today];
  if (pl) out.planner = pd && Array.isArray(pd.tasks) ? { done: pd.tasks.filter(t => t.done).length, total: pd.tasks.length } : { done: 0, total: 0 };

  const w = all.worklist;
  if (w && Array.isArray(w.items)) out.worklist = w.items.filter(i => !i.done).length;

  const r = all.recall;
  if (r && Array.isArray(r.cards)) {
    out.recall = r.cards.filter(c => !c.isNew && c.due && c.due <= today).length;
  }

  const b = all.roadmap;
  if (b && b.p && b.p.topics) out.roadmap = Object.values(b.p.topics).filter(t => t && t.s === 3).length;
  return out;
}

async function render() {
  const s = await stats();
  $("st-plan").textContent = s.planner ? s.planner.done + "/" + s.planner.total : "–";
  $("st-tasks").textContent = s.worklist ?? "–";
  $("st-cards").textContent = s.recall ?? "–";
  $("st-road").textContent = s.roadmap ?? "–";

  const meta = {
    planner: s.planner ? (s.planner.total ? s.planner.done + " of " + s.planner.total + " done today" : "Nothing planned today") : "",
    worklist: s.worklist != null ? s.worklist + " open" : "",
    recall: s.recall != null ? s.recall + " due" : "",
    roadmap: s.roadmap != null ? s.roadmap + " done" : ""
  };

  $("navPages").innerHTML = PAGES.map(p =>
    '<li><a href="#' + p.id + '" data-route="' + p.id + '">' + svg(p.icon) + p.title +
    '<span class="badge">' + (p.id === "worklist" && s.worklist ? s.worklist : p.id === "recall" && s.recall ? s.recall : "") + '</span></a></li>'
  ).join("");

  $("cards").innerHTML = PAGES.map(p =>
    '<a class="card" href="#' + p.id + '" style="--c:' + p.color + '">' +
    '<span class="ic">' + svg(p.icon) + '</span><h3>' + p.title + '</h3><p>' + p.desc + '</p>' +
    '<span class="meta">' + (meta[p.id] || "Open →") + '</span></a>'
  ).join("");
  markCurrent();
}

function route() {
  const id = location.hash.slice(1) || "home";
  const page = PAGES.find(p => p.id === id);
  document.body.classList.toggle("framed", !!page);
  document.body.classList.remove("nav-open");
  if (page) {
    const src = encodeURI(page.file);
    if ($("frame").getAttribute("src") !== src) $("frame").setAttribute("src", src);
    $("viewTitle").textContent = page.title;
    $("newTab").href = src;
    document.title = page.title + " · My Space";
  } else {
    $("frame").removeAttribute("src");
    document.title = "My Space";
  }
  render();
}

function markCurrent() {
  const id = location.hash.slice(1) || "home";
  document.querySelectorAll("nav a").forEach(a => {
    if (a.dataset.route === id) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
}

// Greeting and date
const h = new Date().getHours();
$("greet").textContent = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
$("today").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" });

// Theme
const THEMES = ["auto", "light", "dark"];
let theme = "auto", themeLoaded = false;
function applyTheme() {
  if (theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  $("themeBtn").textContent = "Theme: " + theme[0].toUpperCase() + theme.slice(1);
}
$("themeBtn").addEventListener("click", () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
  if (themeLoaded) Store.save("dashboard", { theme });
  applyTheme();
});

// Mobile drawer
$("menuBtn").addEventListener("click", () => document.body.classList.add("nav-open"));
$("scrim").addEventListener("click", () => document.body.classList.remove("nav-open"));

window.addEventListener("hashchange", route);
applyTheme();
route();
Store.load("dashboard").then(v => {
  themeLoaded = true;
  if (v && THEMES.includes(v.theme)) { theme = v.theme; applyTheme(); }
}).catch(() => { /* server unreachable: keep the default theme */ });
</script>
</body>
</html>
